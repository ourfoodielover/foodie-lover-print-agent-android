name: Build debug APK

# Runs on GitHub's own servers (full internet access to Google's Maven / Maven Central --
# unlike the sandbox this project was authored in, which cannot reach those). Produces an
# installable app-debug.apk as a downloadable build artifact. No signing, no Play Store,
# no release build -- debug APK only, for physically testing CN811 Bluetooth printing.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {} # adds a manual "Run workflow" button on the Actions tab

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error